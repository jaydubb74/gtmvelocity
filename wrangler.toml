name                 = "gtmvelocity"
main                 = "src/worker.js"
compatibility_date   = "2025-09-27"
compatibility_flags  = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "."
binding   = "ASSETS"

[[routes]]
pattern      = "gtmvelocity.ai"
custom_domain = true

# ──────────────────────────────────────────────────────────────────
# EMAIL — Cloudflare Email Routing (free, no third-party service)
#
# One-time setup in Cloudflare dashboard:
#   1. Email → Email Routing → Enable for gtmvelocity.ai
#   2. Email → Email Routing → Destination addresses → Add josh@gtmvelocity.ai → click verify link
#
# Then this binding is all you need — no API keys.
# ──────────────────────────────────────────────────────────────────
[[send_email]]
name                = "SEND_EMAIL"
destination_address = "josh@gtmvelocity.ai"

# ──────────────────────────────────────────────────────────────────
# Secrets — set once via Wrangler CLI, never commit these values:
#
#   wrangler secret put TURNSTILE_SECRET_KEY
#   → paste the secret key from the Cloudflare Turnstile dashboard (never commit it)
#
#   wrangler secret put SLACK_WEBHOOK_URL     (optional)
#   wrangler secret put CONTACT_EMAIL         (optional — override destination)
# ──────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────
# KV Rate Limiting (optional but recommended for production)
#   1. wrangler kv:namespace create RATE_LIMIT_KV
#   2. Copy the id printed to stdout
#   3. Uncomment below and paste the id
# ──────────────────────────────────────────────────────────────────
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id      = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
